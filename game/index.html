
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dodge | Fadhil</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #09090f;
  color: #e5e7eb;
  font-family: Consolas, monospace;
}
.game { width: min(92vw, 420px); text-align: center; }
h1 { color: #00f7ff; text-shadow: 0 0 15px #00f7ff; }
.stats { display: flex; justify-content: space-around; margin: 15px; }
canvas {
  width: 100%;
  background: #0d1117;
  border: 1px solid #00f7ff;
  border-radius: 12px;
  box-shadow: 0 0 25px #00f7ff22;
  touch-action: none;
}
button {
  margin: 12px 5px;
  padding: 12px 22px;
  background: #00f7ff;
  color: #09090f;
  border: 0;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}
p { color: #a5b4fc; font-size: 13px; }
</style>
</head>
<body>
<div class="game">
  <h1>NEON DODGE</h1>
  <p>AVOID THE BLOCKS. BEAT YOUR HIGH SCORE.</p>
  <div class="stats">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="360" height="480"></canvas>
  <div>
    <button id="start">START GAME</button>
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <p>Use ← → or A / D to move. On mobile, use the buttons.</p>
  <a href="https://github.com/padil1243"
     style="color:#00f7ff">← Back to GitHub</a>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let player, blocks, score, running, frame, keys = {};
let best = 0;

try {
  best = Number(localStorage.getItem('neonBest')) || 0;
} catch {}
bestEl.textContent = best;

function reset() {
  player = { x: 160, y: 420, w: 36, h: 24, speed: 5 };
  blocks = [];
  score = 0;
  frame = 0;
  running = true;
  scoreEl.textContent = score;
  requestAnimationFrame(loop);
}

function drawPlayer() {
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#00f7ff';
  ctx.fillStyle = '#00f7ff';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;
}

function loop() {
  if (!running) return;

  frame++;
  ctx.clearRect(0, 0, 360, 480);

  ctx.strokeStyle = '#172033';
  for (let y = 0; y < 480; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(360, y);
    ctx.stroke();
  }

  if (keys.ArrowLeft || keys.a || keys.left)
    player.x -= player.speed;
  if (keys.ArrowRight || keys.d || keys.right)
    player.x += player.speed;

  player.x = Math.max(0, Math.min(360 - player.w, player.x));

  if (frame % Math.max(18, 42 - Math.floor(score / 5)) === 0) {
    blocks.push({
      x: Math.random() * 328,
      y: -24,
      w: 24 + Math.random() * 20,
      h: 20,
      speed: 2.5 + Math.min(score / 20, 5)
    });
  }

  drawPlayer();

  ctx.fillStyle = '#a78bfa';
  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur = 12;

  for (const b of blocks) {
    b.y += b.speed;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    if (
      player.x < b.x + b.w &&
      player.x + player.w > b.x &&
      player.y < b.y + b.h &&
      player.y + player.h > b.y
    ) {
      running = false;
    }
  }

  ctx.shadowBlur = 0;
  blocks = blocks.filter(b => b.y < 500);

  if (frame % 8 === 0) {
    score++;
    scoreEl.textContent = score;
  }

  if (!running) {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem('neonBest', best);
      } catch {}
    }

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px Consolas';
    ctx.fillText('GAME OVER', 180, 220);
    ctx.font = '16px Consolas';
    ctx.fillText('Score: ' + score, 180, 252);
    return;
  }

  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key))
    e.preventDefault();
  keys[e.key] = true;
});
document.addEventListener('keyup', e => keys[e.key] = false);

function hold(button, key) {
  const el = document.getElementById(button);
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    keys[key] = true;
  });
  for (const event of ['pointerup', 'pointerleave', 'pointercancel']) {
    el.addEventListener(event, () => keys[key] = false);
  }
}

hold('left', 'left');
hold('right', 'right');

document.getElementById('start').addEventListener('click', reset);

ctx.fillStyle = '#00f7ff';
ctx.textAlign = 'center';
ctx.font = '20px Consolas';
ctx.fillText('READY PLAYER ONE?', 180, 220);
ctx.font = '14px Consolas';
ctx.fillText('Press START GAME', 180, 250);
</script>
</body>
</html>
